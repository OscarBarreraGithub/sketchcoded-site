<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf9f4" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Sketchcoded</title>
    <!-- Served for any missing address, however deep, so every path starts at the site root. -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="site-document">
    <div class="site-scroll" tabindex="0" aria-label="Page content">
      <header class="wrap site-header">
        <a class="brand" href="/"
          ><img src="/assets/favicon.svg" alt="" />sketchcoded<span>.</span></a
        >
        <nav class="site-nav" aria-label="Site">
          <a href="/demo">Example</a>
          <a href="/guide">Guide</a>
          <a data-link="github" href="#">GitHub</a>
        </nav>
      </header>
      <main class="wrap not-found">
        <h1>Page not found</h1>
        <p>There is no page at this address.</p>
        <div class="not-found-links">
          <a class="button primary" href="/">Home</a>
          <a class="button" href="/demo">Open the example board</a>
          <a class="button" href="/guide">Read the guide</a>
        </div>
      </main>
    </div>
    <button
      class="site-scroll-hint"
      type="button"
      aria-label="Scroll for more content"
    >
      More below ↓
    </button>
    <script src="/links.js"></script>
  </body>
</html>
